<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Black Lives Matter Rhetoric</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header"><nav class="navbar"><a class="brand" href="index.html">BLM Rhetoric</a><button class="nav-toggle">&equiv;</button><div class="nav-links"><a href="index.html">Home</a><a href="about.html">About</a><a href="donate.html">Donate</a><a class="active" href="login.html">Login</a><a href="signup.html">Sign Up</a></div></nav></header>
  <main>
    <section class="form-page">
      <div class="form-copy reveal"><p class="eyebrow">Member Access</p><h1>Login</h1></div>
      <form class="form-card reveal" id="loginForm">
        <label for="loginUsername">Username</label><input id="loginUsername" name="loginUsername" type="text" required>
        <label for="loginPassword">Password</label><input id="loginPassword" name="loginPassword" type="password" required>
        <button class="button primary full" type="submit">Login</button>
        <p class="form-message" id="loginMessage"></p>
      </form>
    </section>
  </main>
  <footer class="footer"></footer>
  <script src="script.js"></script>
