<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | Black Lives Matter Rhetoric</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header"><nav class="navbar"><a class="brand" href="index.html">BLM Rhetoric</a><button class="nav-toggle">&equiv;</button><div class="nav-links"><a href="index.html">Home</a><a href="about.html">About</a><a href="donate.html">Donate</a><a href="login.html">Login</a><a class="active" href="signup.html">Sign Up</a></div></nav></header>
  <main>
    <section class="form-page">
      <div class="form-copy reveal"><p class="eyebrow">Join US</p><h1>Create an Account</h1></div>
      <form class="form-card reveal" id="signupForm">
        <label for="signupUsername">Username</label><input id="signupUsername" name="signupUsername" type="text" required>
        <label for="signupEmail">Email</label><input id="signupEmail" name="signupEmail" type="email" required>
        <label for="signupPassword">Password</label><input id="signupPassword" name="signupPassword" type="password" required>
        <button class="button primary full" type="submit">Create Account</button>
        <p class="form-message" id="signupMessage"></p>
      </form>
    </section>
  </main>
  <footer class="footer"></footer>
  <script src="script.js"></script>
</body>
</html>
